{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Mulai Gym{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=28">
    
    <link rel="icon" type="image/png" href="{% static 'favicons/favicon-96x96.png' %}" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{% static 'favicons/favicon.svg' %}" />
    <link rel="shortcut icon" href="{% static 'favicons/favicon.ico' %}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicons/apple-touch-icon.png' %}" />
    <meta name="apple-mobile-web-app-title" content="Mulai Gym" />
    <link rel="manifest" href="{% static 'favicons/site.webmanifest' %}" />
    
    <style>
        body {
            background-color: #4B4BEC;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            width: 100%;
        }
        .navbar {
            background: linear-gradient(90deg, #5555ef, #ffffff) !important;
            text-align: center;
            height: 7.5vh;
            width: 100vw;
            max-width: 100%;
            position: relative;
            overflow: visible;
        }
        .navbar-brand {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            height: 75%;
            display: flex;
            align-items: center;
            z-index: 1050;
        }
        .navbar-brand img {
            height: 100%;
            max-height: 115%;
            object-fit: contain;
        }
        .navbar-toggler {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            padding: 0;
            z-index: 1051;
            color: var(--primary);
        }
        .navbar-toggler i {
            font-size: 1.8rem;
        }
        /* Prevent darkening of navbar when offcanvas opens */
        .offcanvas-backdrop {
            z-index: 999;
        }
        /* Ensure the offcanvas is properly positioned */
        .offcanvas {
            top: 7.5vh !important;
            height: calc(100vh - 7.5vh - 10vh) !important;
            position: fixed !important;
            overflow-y: auto !important;
        }
        
        /* Ensure full-width images */
        .full-width-img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a class="navbar-brand" href="/">
            <img src="{% static 'images/logo_navbar.png' %}" alt="Mulai Gym" onerror="this.src='https://placehold.co/120x40/4B4BEC/FFFFFF?text=MULAI+GYM'">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarOffcanvas" aria-controls="navbarOffcanvas">
            <i class="fas fa-bars"></i>
        </button>
    </nav>
    
    <!-- Main content -->
    <div class="container-fluid p-0" style="background-color: #4B4BEC;">
        {% block content %}
        {% endblock %}
    </div>
    
    <!-- Mobile Offcanvas Menu -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="navbarOffcanvas" aria-labelledby="navbarOffcanvasLabel" style="max-width: 50%;">
        <div class="offcanvas-body d-flex flex-column">
            <ul class="navbar-nav flex-grow-1">
                <li class="nav-item">
                    <a class="nav-link"></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-bold" href="{{ request.scheme }}://{{ request.get_host }}/#home">• Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-bold" href="{{ request.scheme }}://{{ request.get_host }}/#kenapa-mulai">• Kenapa <img src="{% static 'images/mulai_white.png' %}" alt="Mulai" style="height: 1em; display: inline-block; vertical-align: middle;"> ?</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-bold" href="{{ request.scheme }}://{{ request.get_host }}/#mari-mulai">• Mari <img src="{% static 'images/mulai_white.png' %}" alt="Mulai" style="height: 1em; display: inline-block; vertical-align: middle;"> !</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-bold" href="{{ request.scheme }}://{{ request.get_host }}/#membership">• Membership</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-bold" href="{{ request.scheme }}://{{ request.get_host }}/#fasilitas">• Fasilitas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-bold" href="{{ request.scheme }}://{{ request.get_host }}/#kontak">• Kontak</a>
                </li>
            </ul>
            <div class="mt-auto">
                {% if request.session.member_email %}
                    <div class="nav-item mb-2">
                        <a class="btn btn-secondary w-100" href="{% url 'member_details' %}">Akun Saya</a>
                    </div>
                    <div class="nav-item mb-3">
                        <a class="btn btn-outline-secondary w-100" href="{% url 'member_logout' %}">Keluar</a>
                    </div>
                {% else %}
                    <div class="nav-item mb-2">
                        <a class="btn btn-secondary w-100" href="{% url 'signup' %}">Daftar</a>
                    </div>
                    <div class="nav-item mb-3">
                        <a class="btn btn-outline-secondary w-100" href="{% url 'member_login' %}">Masuk</a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const isHomePage = window.location.pathname === '/' || 
                          window.location.pathname === '/home/';
        const offcanvasElement = document.getElementById('navbarOffcanvas');
        let bsOffcanvas = null;
        if (offcanvasElement) {
            // Use getOrCreateInstance to ensure we have a valid Bootstrap object
            bsOffcanvas = bootstrap.Offcanvas.getOrCreateInstance(offcanvasElement);
        }

        document.querySelectorAll('.offcanvas-body .nav-link').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                // Determine if we should smooth scroll
                const shouldSmoothScroll = isHomePage && 
                                           this.hostname === window.location.hostname && 
                                           this.pathname === window.location.pathname && 
                                           this.hash;

                if (shouldSmoothScroll) {
                    e.preventDefault(); // Prevent default navigation
                    
                    // Hide the offcanvas first
                    if (bsOffcanvas) {
                        bsOffcanvas.hide();
                    }

                    // Perform smooth scroll
                    const targetId = this.hash;
                    const targetElement = document.querySelector(targetId);
                    if (targetElement) {
                        const offset = 80; 
                        const targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - offset;
                        
                        // Scroll after a short delay to allow hide animation to start
                        setTimeout(() => {
                             window.scrollTo({
                                top: targetPosition,
                                behavior: 'smooth'
                            });
                        }, 50); // Shorter delay
                    }
                } else {
                    // If not smooth scrolling (i.e., navigating away or no hash),
                    // ensure the offcanvas closes.
                    // The browser navigation will happen automatically since we didn't preventDefault.
                    if (bsOffcanvas) {
                         // Optionally add a short delay if needed, but hide() should be okay here.
                        bsOffcanvas.hide(); 
                    }
                }
            });
        });
    });
    </script>
</body>
</html>
