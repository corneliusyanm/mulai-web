{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Mulai Gym{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/logo_title.svg' %}" type="image/png">
    <style>
        body {
            background-color: #4B4BEC;
        }
        .navbar {
            background: linear-gradient(90deg, #5555ef, #ffffff) !important;
            text-align: center;
        }
        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-brand {
            margin: 0 auto;
        }
        .navbar-toggler {
            position: absolute;
            right: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/" style="margin: 0; left: 20px;">
                <img src="{% static 'images/logo_navbar.png' %}" alt="Mulai Gym" height="40" onerror="this.src='https://placehold.co/120x40/4B4BEC/FFFFFF?text=MULAI+GYM'">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarOffcanvas" aria-controls="navbarOffcanvas" style="color: var(--primary); right: 20px;">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>
    
    <!-- Main content -->
    <div class="container" style="background-color: #4B4BEC;">
        {% block content %}
        {% endblock %}
    </div>
    
    <!-- Mobile Offcanvas Menu -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="navbarOffcanvas" aria-labelledby="navbarOffcanvasLabel">
        <div class="offcanvas-body">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link"></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ request.scheme }}://{{ request.get_host }}/#home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ request.scheme }}://{{ request.get_host }}/#kenapa-mulai">Kenapa Mulai?</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ request.scheme }}://{{ request.get_host }}/#mari-mulai">Mari Mulai</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ request.scheme }}://{{ request.get_host }}/#membership">Membership</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ request.scheme }}://{{ request.get_host }}/#fasilitas">Fasilitas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ request.scheme }}://{{ request.get_host }}/#kelas">Kelas</a>
                </li>
                {% if request.session.member_email %}
                    <li class="nav-item mt-4">
                        <a class="btn btn-secondary w-100" href="{% url 'member_details' %}">Akun Saya</a>
                    </li>
                    <li class="nav-item mt-2">
                        <a class="btn btn-outline-secondary w-100" href="{% url 'member_logout' %}">Keluar</a>
                    </li>
                {% else %}
                    <li class="nav-item mt-4">
                        <a class="btn btn-secondary w-100" href="{% url 'signup' %}">Daftar</a>
                    </li>
                    <li class="nav-item mt-2">
                        <a class="btn btn-outline-secondary w-100" href="{% url 'member_login' %}">Masuk</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const isHomePage = window.location.pathname === '/' || 
                          window.location.pathname === '/home/';
        const offcanvasElement = document.getElementById('navbarOffcanvas');
        let bsOffcanvas = null;
        if (offcanvasElement) {
            // Use getOrCreateInstance to ensure we have a valid Bootstrap object
            bsOffcanvas = bootstrap.Offcanvas.getOrCreateInstance(offcanvasElement);
        }

        document.querySelectorAll('.offcanvas-body .nav-link').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                // Determine if we should smooth scroll
                const shouldSmoothScroll = isHomePage && 
                                           this.hostname === window.location.hostname && 
                                           this.pathname === window.location.pathname && 
                                           this.hash;

                if (shouldSmoothScroll) {
                    e.preventDefault(); // Prevent default navigation
                    
                    // Hide the offcanvas first
                    if (bsOffcanvas) {
                        bsOffcanvas.hide();
                    }

                    // Perform smooth scroll
                    const targetId = this.hash;
                    const targetElement = document.querySelector(targetId);
                    if (targetElement) {
                        const offset = 80; 
                        const targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - offset;
                        
                        // Scroll after a short delay to allow hide animation to start
                        setTimeout(() => {
                             window.scrollTo({
                                top: targetPosition,
                                behavior: 'smooth'
                            });
                        }, 50); // Shorter delay
                    }
                } else {
                    // If not smooth scrolling (i.e., navigating away or no hash),
                    // ensure the offcanvas closes.
                    // The browser navigation will happen automatically since we didn't preventDefault.
                    if (bsOffcanvas) {
                         // Optionally add a short delay if needed, but hide() should be okay here.
                        bsOffcanvas.hide(); 
                    }
                }
            });
        });
    });
    </script>
</body>
</html>
