{% extends 'base.html' %}

{% block title %}Sign Up Successful - Mulai Gym{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body text-center">
                <h2 class="text-success mb-4">Sign Up Successful!</h2>
                <p>Thank you for signing up with Mulai Gym.</p>
                <p>You are now logged in and can access your account or check in to the gym.</p>
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="{% url 'member_details' %}" class="btn btn-primary">My Account</a>
                    <a href="/" class="btn btn-outline-secondary">Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
