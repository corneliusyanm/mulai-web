{% extends 'base.html' %}
{% load widget_tweaks %}

{% block title %}Check Out - Mulai Gym{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 mx-auto" style="margin: 1rem 6rem 7rem 6rem;">
            <div class="bg-transparent p-4">
                <h2 class="mb-4 text-white fw-bold text-center">Check Out</h2>
                <div class="bg-transparent text-white">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label text-white fw-bold">Email</label>
                            <input type="email" class="form-control bg-transparent text-white border-light" id="email" name="email" required>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-secondary">Check Out Sekarang</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
