{% extends 'base.html' %}
{% load static %}

{% block title %}QR Code Check-in - Mulai Gym{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 mx-auto" style="margin: 1rem 6rem 7rem 6rem;">
            <div class="bg-transparent p-4">
                <h2 class="mb-4 text-white fw-bold text-center">QR Code Check-in</h2>
                <div class="bg-transparent text-white text-center">
                    <div id="qrcode" class="mb-4 bg-white p-4 d-inline-block rounded"></div>
                    <p class="mb-4">Scan QR code ini di gym untuk melakukan check in</p>
                    <div class="text-center mt-4">
                        <a href="{% url 'member_details' %}" class="btn btn-secondary">Kembali ke Akun Saya</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Include QR Code library -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
    // Generate QR code
    var qrcode = new QRCode(document.getElementById("qrcode"), {
        text: "{{ request.scheme }}://{{ request.get_host }}{% url 'check_in' member.check_in_code %}",
        width: 256,
        height: 256
    });
</script>
{% endblock %}
