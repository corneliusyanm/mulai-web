{% extends 'base.html' %}

{% block title %}Check Out Successful - Mulai Gym{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-success mb-4">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    <p>Thank you for visiting Mulai Gym!</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
