name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v2
      
      - name: Deploy to Digital Ocean droplet
        uses: appleboy/ssh-action@master
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DJANGO_SECRET_KEY,DJANGO_DEBUG,GH_TOKEN
          script: |
            cd /root/mulai_web
            
            # Debug: Print environment variables (safely)
            echo "Debug value: $DJANGO_DEBUG"
            echo "Secret key exists: $([[ ! -z "$DJANGO_SECRET_KEY" ]] && echo 'yes' || echo 'no')"
            
            # Update git remote with new token
            git remote set-url origin "https://oauth2:${GH_TOKEN}@github.com/corneliusyanm/mulai-web.git"
            git pull
            
            docker build -t mulai_web .
            docker stop mulai_web || true
            docker rm mulai_web || true
            
            # Pass the variables directly
            docker run -d \
              --name mulai_web \
              -p 8000:8000 \
              -e "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" \
              -e "DJANGO_DEBUG=$DJANGO_DEBUG" \
              -v /root/mulai_web/media:/app/media \
              -v /root/mulai_web/staticfiles:/app/staticfiles \
              mulai_web

            # Wait for container to be ready
            sleep 5

            # Run migrations
            echo "Running migrations..."
            docker exec mulai_web python manage.py migrate

            # Run collectstatic after container is running
            echo "Collecting static files..."
            docker exec mulai_web python manage.py collectstatic --noinput

            # Verify environment variables
            echo "Container environment variables:"
            docker exec mulai_web env | grep DJANGO

            echo "Deployment completed successfully!"