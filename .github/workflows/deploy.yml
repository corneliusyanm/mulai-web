name: Test and Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_mulai_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        env:
          DB_NAME: test_mulai_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DJANGO_SECRET_KEY: "a-dummy-secret-key-for-ci"
          DJANGO_DEBUG: "True"
        run: python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Digital Ocean droplet
        uses: appleboy/ssh-action@master
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG }}
          RAMADAN_MODE: ${{ vars.RAMADAN_MODE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: DJANGO_SECRET_KEY,DJANGO_DEBUG,RAMADAN_MODE,GH_TOKEN,DB_NAME,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT
          script: |
            cd /root/mulai_web
            
            # Debug: Print environment variables (safely)
            echo "Debug value: $DJANGO_DEBUG"
            echo "Secret key exists: $([[ ! -z "$DJANGO_SECRET_KEY" ]] && echo 'yes' || echo 'no')"
            echo "DB connection info available: $([[ ! -z "$DB_HOST" ]] && echo 'yes' || echo 'no')"
            
            # Check disk space and clean up only if needed (>80% usage)
            DISK_USAGE=$(df / | awk 'NR==2 {print $5}' | sed 's/%//')
            if [ "$DISK_USAGE" -gt 80 ]; then
              echo "Disk usage at ${DISK_USAGE}%, cleaning up..."
              # Remove unused Docker images, containers, networks, and volumes
              docker system prune -af --volumes
              echo "Disk space after cleanup:"
              df -h
            else
              echo "Disk usage at ${DISK_USAGE}%, no cleanup needed"
            fi
            
            # Update git remote with new token
            git remote set-url origin "https://oauth2:${GH_TOKEN}@github.com/corneliusyanm/mulai-web.git"
            git fetch origin
            git reset --hard origin/main
            
            # Enable Docker BuildKit for faster builds and better caching
            export DOCKER_BUILDKIT=1
            
            # Build with cache optimization (safe fallback if no previous image)
            if docker image inspect mulai_web:latest >/dev/null 2>&1; then
              echo "Using cache from previous image..."
              docker build \
                --cache-from mulai_web:latest \
                --build-arg BUILDKIT_INLINE_CACHE=1 \
                -t mulai_web .
            else
              echo "No previous image found, building without cache..."
              docker build \
                --build-arg BUILDKIT_INLINE_CACHE=1 \
                -t mulai_web .
            fi
            docker stop mulai_web || true
            docker rm mulai_web || true
            
            # Pass the variables directly with restart policy
            docker run -d \
              --name mulai_web \
              --restart unless-stopped \
              -p 8000:8000 \
              --health-cmd "curl -f http://localhost:8000/ || exit 1" \
              --health-interval=5s \
              --health-retries=5 \
              --health-timeout=2s \
              -e "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" \
              -e "DJANGO_DEBUG=$DJANGO_DEBUG" \
              -e "RAMADAN_MODE=$RAMADAN_MODE" \
              -e "DB_NAME=$DB_NAME" \
              -e "DB_USER=$DB_USER" \
              -e "DB_PASSWORD=$DB_PASSWORD" \
              -e "DB_HOST=$DB_HOST" \
              -e "DB_PORT=$DB_PORT" \
              -v /root/mulai_web/media:/app/media \
              -v /root/mulai_web/staticfiles:/app/staticfiles \
              -v /root/mulai_web/data:/app/data \
              mulai_web

            # Wait for container to become healthy or fail (optimized timing)
            echo "Waiting for container to start..."
            for i in {1..20}; do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' mulai_web 2>/dev/null || echo "starting")
              echo "Health check attempt $i: $STATUS"
              
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "Container is unhealthy. Dumping logs and exiting."
                docker logs mulai_web
                exit 1
              fi
              
              # Faster initial checks, slower later ones
              if [ $i -le 5 ]; then
                sleep 2
              else
                sleep 3
              fi
            done

            # Final check
            if [ "$(docker inspect --format '{{.State.Health.Status}}' mulai_web)" != "healthy" ]; then
              echo "Container failed to start. Dumping logs."
              docker logs mulai_web
              exit 1
            fi

            # Run migrations first, then collectstatic (sequential for safety)
            echo "Running migrations..."
            docker exec mulai_web python manage.py migrate
            if [ $? -ne 0 ]; then
              echo "Migration failed!"
              exit 1
            fi

            echo "Collecting static files..."
            docker exec mulai_web python manage.py collectstatic --noinput
            if [ $? -ne 0 ]; then
              echo "Collectstatic failed!"
              exit 1
            fi

            # Final health verification
            echo "Verifying deployment health..."
            FINAL_STATUS=$(docker inspect --format '{{.State.Health.Status}}' mulai_web)
            if [ "$FINAL_STATUS" != "healthy" ]; then
              echo "Final health check failed: $FINAL_STATUS"
              docker logs --tail=50 mulai_web
              exit 1
            fi

            echo "✅ Deployment completed successfully!"
            echo "Container status: $(docker ps --filter name=mulai_web --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}')"