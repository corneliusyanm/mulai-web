name: Test and Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_mulai_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        env:
          DB_NAME: test_mulai_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DJANGO_SECRET_KEY: "a-dummy-secret-key-for-ci"
          DJANGO_DEBUG: "True"
        run: python manage.py test

  deploy:
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Deploy to Digital Ocean droplet
        uses: appleboy/ssh-action@master
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DJANGO_SECRET_KEY,DJANGO_DEBUG,GH_TOKEN,DB_NAME,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT
          script: |
            cd /root/mulai_web
            
            # Debug: Print environment variables (safely)
            echo "Debug value: $DJANGO_DEBUG"
            echo "Secret key exists: $([[ ! -z "$DJANGO_SECRET_KEY" ]] && echo 'yes' || echo 'no')"
            echo "DB connection info available: $([[ ! -z "$DB_HOST" ]] && echo 'yes' || echo 'no')"
            
            # Clean up disk space
            echo "Cleaning up disk space..."
            # Remove unused Docker images, containers, networks, and volumes
            docker system prune -af --volumes
            # Check disk space after cleanup
            echo "Disk space after cleanup:"
            df -h
            
            # Update git remote with new token
            git remote set-url origin "https://oauth2:${GH_TOKEN}@github.com/corneliusyanm/mulai-web.git"
            git fetch origin
            git reset --hard origin/main
            
            docker build -t mulai_web .
            docker stop mulai_web || true
            docker rm mulai_web || true
            
            # Pass the variables directly
            docker run -d \
              --name mulai_web \
              -p 8000:8000 \
              --health-cmd "curl -f http://localhost:8000/ || exit 1" \
              --health-interval=5s \
              --health-retries=5 \
              --health-timeout=2s \
              -e "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" \
              -e "DJANGO_DEBUG=$DJANGO_DEBUG" \
              -e "DB_NAME=$DB_NAME" \
              -e "DB_USER=$DB_USER" \
              -e "DB_PASSWORD=$DB_PASSWORD" \
              -e "DB_HOST=$DB_HOST" \
              -e "DB_PORT=$DB_PORT" \
              -v /root/mulai_web/media:/app/media \
              -v /root/mulai_web/staticfiles:/app/staticfiles \
              -v /root/mulai_web/data:/app/data \
              mulai_web

            # Wait for container to become healthy or fail
            echo "Waiting for container to start..."
            for i in {1..12}; do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' mulai_web)
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "Container is unhealthy. Dumping logs and exiting."
                docker logs mulai_web
                exit 1
              fi
              sleep 5
            done

            # Final check
            if [ "$(docker inspect --format '{{.State.Health.Status}}' mulai_web)" != "healthy" ]; then
              echo "Container failed to start. Dumping logs."
              docker logs mulai_web
              exit 1
            fi

            # Run migrations
            echo "Running migrations..."
            docker exec mulai_web python manage.py migrate

            # Run collectstatic after container is running
            echo "Collecting static files..."
            docker exec mulai_web python manage.py collectstatic --noinput

            # Verify environment variables
            echo "Container environment variables:"
            docker exec mulai_web env | grep DJANGO

            echo "Deployment completed successfully!"